# Project dev tools. Go and other base runtimes come from the global mise
# config. DCDC (the artisan CLI) is a Rust binary installed separately via
# its install script or a local mise plugin; it is not pinned here. The
# gopherjs CLI is not pinned here: webbuild builds it automatically.
[tools]
air = "1.67.4"
"go:github.com/a-h/templ/cmd/templ" = "v0.3.1020"
